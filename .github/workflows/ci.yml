# EAS 550 - step 2.2
# Aidan Collins
# runs when someone opens a PR to main

on:
  pull_request:
    branches:
      - main

jobs:

  # sql linting
  lint:
    name: SQLFluff Lint
    runs-on: ubuntu-latest

    steps:
      - name: Download our code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # installs what we need to lint
      - name: Install SQLFluff and dbt
        run: pip install "sqlfluff==3.1.0" "sqlfluff-templater-dbt==3.1.0" "dbt-postgres==1.8.0"

      # needed so sqlfluff can read our models
      - name: Install dbt packages
        working-directory: ecommerce
        run: dbt deps

      # warn-only so style stuff doesnt block the PR
      - name: Run the SQL linter
        working-directory: ecommerce
        run: sqlfluff lint models/ --dialect postgres --templater dbt --warn-only


  # dbt tests
  # only runs if linting passed
  dbt-test:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    needs: lint

    # spins up a temp postgres db, github deletes it after the job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce_ci
          POSTGRES_USER: dbt_ci
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbt_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Download our code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install "dbt-postgres==1.8.0" psycopg2-binary

      - name: Install dbt packages
        working-directory: ecommerce
        run: dbt deps

      # writing this here instead of committing it so the password stays hidden
      - name: Create dbt connection profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          ecommerce:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                dbname: ecommerce_ci
                user: dbt_ci
                password: ${{ secrets.POSTGRES_CI_PASSWORD }}
                schema: commerce
                threads: 4
          EOF

      # loads our tables
      - name: Load our schema into the CI database
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD }}
        run: psql -h localhost -U dbt_ci -d ecommerce_ci -f src/schema.sql

      # runs staging models then marts then all the tests
      # if any test fails the job fails and PR gets blocked
      - name: Run dbt models and tests
        working-directory: ecommerce
        run: dbt build --profiles-dir ~/.dbt

      # generates the data catalog from 2.1
      - name: Generate dbt docs
        working-directory: ecommerce
        run: dbt docs generate --profiles-dir ~/.dbt

      # upload so anyone can download it from the PR page
      - name: Upload dbt docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: ecommerce/target/
          retention-days: 7
