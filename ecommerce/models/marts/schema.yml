version: 2

models:
  - name: fct_order_items
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_key
            - order_item_num
    columns:
      - name: order_key
        tests:
          - not_null
      - name: order_item_num
        tests:
          - not_null
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_products') }}"
                field: product_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_customers') }}"
                field: customer_key
      - name: seller_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_sellers') }}"
                field: seller_key
      - name: customer_zip
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_zips') }}"
                field: zip
      - name: item_price
        tests:
          - not_null
      - name: item_freight
        tests:
          - not_null